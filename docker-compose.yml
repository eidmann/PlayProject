services:
  db:
    image: postgres:17
    container_name: mindlog-db
    environment:
      POSTGRES_USER: mindlog
      POSTGRES_PASSWORD: mindlog
      POSTGRES_DB: mindlog
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindlog']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
